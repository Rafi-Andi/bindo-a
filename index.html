<p>Lautan mengalami ancaman pemanasan dan menjadi semakin asam karena kita terus memompa lebih banyak CO2 ke atmosfer. Selain itu, lautan juga menghadapi ancaman lain dari manusia, yakni penggunaan plastik. Kehidupan modern saat ini didominasi oleh kemasan makanan berbahan plastik yang diolah dengan teknologi tinggi dan digunakan setiap hari oleh masyarakat. Dalam sebuah laporan telah disebutkan bahwa pada tahun 2050 sampah plastik di laut akan lebih banyak daripada jumlah ikan apabila kecenderungan ini terus berlanjut. Hal tersebut merupakan sebuah ancaman besar.</p>
<p>Dibutuhkan tindakan skala besar untuk berpindah dari kecenderungan tersebut mengingat banyak pihak yang terlibat dalam bidang pekerjaan ini. Masyarakat sektor swasta dan masyarakat sipil perlu mobilisasi untuk menangkap peluang ekonomi lain di luar dari pengelolaan plastik.</p>
<p>Solusi tersebut tidak mudah. Fakta bahwa harga minyak yang rendah mengakibatkan biaya yang dibutuhkan untuk daur ulang plastik jauh lebih mahal daripada memproduksi yang baru. Kondisi lain yang menunjukkan ekonomi di negara berkembang tumbuh lebih besar menjadikan penggunaan plastik juga meningkat. Solusi yang dibutuhkan adalah cara kita menggunakan plastik. Misalnya dengan mengurangi penggunaan plastik dalam kemasan atau menggunakannya kembali sebanyak yang kita bisa.</p>

opts:['Sampah plastik di laut akan lebih banyak daripada jumlah ikan.','Lautan akan terus mengalami pemanasan dan semakin asam.','Manusia terus memompa lebih banyak CO2 ke atmosfer.','Jumlah ikan yang terancam punah semakin banyak.','Penggunaan plastik terus meningkat dan tidak dikelola dengan baik'],
kunci:[0,4],
bahas:'<b>Mengapa 2 jawaban?</b> Teks eksplisit: “pada tahun 2050 sampah plastik ... lebih banyak daripada jumlah ikan apabila kecenderungan ini terus berlanjut.” Kecenderungan = penggunaan plastik terus meningkat tanpa pengelolaan. Opsi pemanasan/CO2 memang ancaman umum, tapi bukan prediksi khusus 2050 di teks. Opsi ikan punah tidak ada di teks.'},
{id:4, passage:PASSAGE_A, tipe:'bs', tanya:'“Solusi tersebut tidak mudah.” Mengapa penulis menggunakan kalimat tersebut? <br><small>Tentukan Benar atau Salah!</small>',
labels:['Benar','Salah'],
statements:['Menginformasikan bahwa pemecahan masalah sampah merupakan tanggung jawab utama kita sebagai masyarakat sipil sehingga sulit diselesaikan.','Menunjukkan bahwa permasalahan sampah plastik sangat rumit dan tidak bisa diselesaikan dalam jangka waktu singkat.','Membuktikan bahwa permasalahan rumit disebabkan pemecahan masalah yang bergantung pada perekonomian negara berkembang.'],
kunci:['Salah','Benar','Salah'],
bahas:'<b>Alasan:</b> (1) Salah – teks tak bilang tanggung jawab utama masyarakat sipil. (2) Benar – kalimat itu pengantar 2 fakta rumit: minyak murah → daur ulang mahal, + ekonomi berkembang → plastik naik. (3) Salah – menyederhanakan hanya ke negara berkembang, padahal ada 2 sebab, dan redaksinya terbalik (bukan “pemecahan bergantung”, tapi “ekonomi tumbuh → pakai plastik naik”).'},
{id:5, passage:PASSAGE_B, tipe:'bs', tanya:'Apa permasalahan yang dihadapi tokoh aku dalam kutipan tersebut? <br><small>Tentukan Benar atau Salah!</small>',
labels:['Benar','Salah'],
statements:['Kekecewaan dan kesedihan tokoh aku terhadap sikap Ayahnya yang tidak mengizinkannya masuk sekolah di musim maddongi, padahal dia harus mempersiapkan diri untuk lomba.','Kemarahan hati tokoh aku terhadap Ayahnya yang melarang sekolah karena maddongi dan tugas menghalau burung.','Perasaan tertekan terhadap peraturan keluarga yang mengharuskan tidak masuk sekolah setiap musim maddongi, padahal ingin belajar.'],
kunci:['Benar','Salah','Salah'],
bahas:'<b>Alasan:</b> (1) Benar – “terpana, hampir menangis histeris, lomba dekat, takut hancur”. (2) Salah – ia menahan diri, sadar berteriak tak selesaikan masalah malah buat Ayah geram; bukan marah. (3) Salah – teks soal kejadian kali ini + lomba, bukan aturan “setiap musim”.'},
{id:6, passage:PASSAGE_B, tipe:'cek', tanya:'Apa yang akan terjadi jika tokoh aku tidak datang ke rumah <i>iyye</i>? <br><small>Jawaban benar lebih dari satu.</small>',
opts:['Iyye akan datang menasehati Ayah karena melarang tokoh aku untuk belajar.','Tokoh aku akan kehilangan kesempatan belajar untuk mengikuti lomba.','Ayah akan tetap melarang tokoh aku untuk belajar dan mengikuti lomba.','Permasalahan tokoh aku dan ayah akan berlarut karena tidak terselesaikan.','Tokoh aku tidak akan bisa fokus untuk belajar dan mengikuti lomba.'],
kunci:[1,3],
bahas:'<b>Sesuai kunci resmi:</b> (B) Tokoh aku akan kehilangan kesempatan belajar untuk mengikuti lomba + (D) Permasalahan tokoh aku dan ayah akan berlarut karena tidak terselesaikan. Hanya iyye yang “mampu menundukkan Ayah”, tanpa lapor iyye tak tahu/tak datang.'},
{id:7, passage:PASSAGE_B, tipe:'pg', tanya:'Keterkaitan nilai sosial dalam kutipan cerpen tersebut dengan kehidupan sehari-hari adalah …',
opts:['Masih ditemukan orang tua yang tidak memedulikan pendidikan anaknya demi membantu pekerjaan mereka.','Terbenturnya cita-cita anak karena tradisi keluarga yang mengutamakan anak mampu bekerja mandiri.','Asumsi bahwa bekerja lebih bermanfaat daripada sekolah yang dianggap tidak menghasilkan apa-apa.','Kebiasaan anak-anak tidak sekolah di musim maddongi demi tradisi keluarga.','Orang tua mengarahkan anak rajin bekerja membantu di sawah agar bisa lanjutkan hidup kelak.'],
kunci:[0],
bahas:'<b>Mengapa opsi 1?</b> Ayah menyuruh izin sekolah untuk bantu di sawah. Ini cermin realita: ada orang tua yang mengorbankan sekolah anak demi pekerjaan. Opsi lain soal tradisi mandiri / asumsi sekolah tak berguna tidak didukung teks.'},
{id:8, passage:PASSAGE_C, tipe:'pg', tanya:'Tujuan penulis sesuai teks 1 adalah ...',
opts:['Menginformasikan jenis dan rasa makanan yang mengandung Rhodamin B.','Menjelaskan dampak penggunaan Rhodamin B pada bahan-bahan industri.','Mengimbau agar masyarakat tidak menggunakan barang yang mengandung Rhodamin B.','Menginformasikan dampak mengonsumsi makanan yang mengandung Rhodamin B bagi tubuh.','Menjelaskan gejala yang timbul akibat mengonsumsi makanan yang mengandung Rhodamin B.'],

bahas:'<b>Mengapa opsi 4?</b> Teks 1 menyebut contoh makanan hanya sebagai pengantar, fokusnya ke bahaya: gangguan hati, kanker, menumpuk di lemak/hati, karsinogenik. Bukan soal rasa, bukan soal industri, dan bukan imbauan umum.'},
{id:9, passage:PASSAGE_C, tipe:'pg', tanya:'Pernyataan yang tepat sesuai isi kedua teks berkaitan dengan Rhodamin B adalah ...',
opts:['Rhodamin B sering disalahgunakan sebagai pewarna makanan karena menawarkan cita rasa yang tinggi.','Rhodamin B berdampak buruk bagi kesehatan, tetapi diperlukan pada industri tekstil dan kertas.','Rhodamin B berdampak buruk bagi kesehatan, tetapi mudah ditemukan pada kembang gula dan sirup.','Rhodamin B yang berbentuk serbuk kristal dan berwarna hijau digunakan pada industri tekstil dan kertas.','Rhodamin B berdampak buruk bagi kesehatan, meskipun dampak itu baru terlihat beberapa tahun kemudian.'],

{id:10, passage:PASSAGE_C, tipe:'cek', tanya:'Mengapa kedua teks menyebutkan dampak kesehatan dari konsumsi pangan terkontaminasi Rhodamin B? <br><small>Jawaban benar lebih dari satu.</small>',
opts:['Mendorong masyarakat untuk menghindari Rhodamin B dalam berbagai keperluan.','Meningkatkan kesadaran masyarakat tentang bahaya Rhodamin B dalam makanan.','Menunjukkan bahwa Rhodamin B aman digunakan dalam industri tekstil dan kertas.','Menjelaskan bahwa Rhodamin B adalah zat berbahaya jika dikonsumsi, terutama dalam jangka panjang.','Memperingatkan masyarakat agar menghindari makanan berwarna mencolok yang berisiko mengandung Rhodamin B.'],

{id:11, passage:PASSAGE_D, tipe:'pg', tanya:'Bagan yang tepat untuk menggambarkan bagian penting teks tersebut adalah …',

kunci:[0],
bahas:'<b>Sesuai kunci resmi: (A).</b> Bagan lengkap memuat pusat Ekonomi Digital + 4 simpul: dampak, manfaat teknis, tantangan adaptasi/literasi, peluang pertumbuhan & keberlanjutan UKM.'},
{id:12, passage:PASSAGE_D, tipe:'bs', tanya:'Bagaimana pola pengembangan paragraf 1, 2, dan 3? <br><small>Tentukan Benar atau Salah!</small>',

{id:13, passage:PASSAGE_D, tipe:'bs', tanya:'Mengapa pendapat Sena sangat baik dalam menilai keakuratan? <br><small>Dini-Rio-Sena. Sena usul tambah data 5 tahun + pendapat ahli.</small>',

statements:['Sena menyoroti teks harus mudah dipahami semua kalangan termasuk awam ekonomi.','Sena mempertimbangkan kelengkapan dan dasar bukti yang merupakan bagian menilai keakuratan.','Sena berinisiatif memperbaiki isi dengan pendapat pribadinya sebagai ahli ekonomi.'],

{id:14, passage:PASSAGE_E, tipe:'pg', tanya:'“...keluarga saya harus <i>boyongan</i>...” Penggunaan kata <i>boyongan</i> memperjelas peristiwa ...',
opts:['Pindahan yang sering dialami pegawai untuk promosi jabatan.','Pindah rumah dari kampung ke tempat jauh untuk jangka lama.','Pindah rumah bersama seluruh keluarga dengan membawa semua barang rumah tangga.','Pindah rumah untuk ikut tugas kedinasan orang tua di tempat baru yang sangat jauh.','Pindah rumah sementara dan akan pindah lagi.'],

{id:15, passage:PASSAGE_E, tipe:'bs', tanya:'Peristiwa apa yang mungkin terjadi pada sahabatnya jika tokoh saya tidak ikut mencari jangkrik? <br><small>Tentukan Tepat / Tidak Tepat!</small>',

{id:16, passage:PASSAGE_E, tipe:'cek', tanya:'Kalimat mana yang membuktikan karakter sahabat setia kawan? <br><small>Jawaban benar lebih dari satu.</small>',
opts:['Saya langsung menyatakan ingin ikut, tapi dia keberatan.','Dia memang tidak memiliki banyak pakaian hingga seragam sekolah biasa dipakai kapan saja.','Sahabat saya itu tanggap melingkupi tubuh saya dengan seragam coklatnya.','Dia menggendong saya lalu berlari sembari membujuk-bujuk saya untuk tetap tenang.','Rasa tanggung jawab yang besar seperti memberinya kekuatan berlipat untuk tetap bersama saya.'],
kunci:[2,3,4],

{id:17, passage:PASSAGE_F, tipe:'bs', tanya:'Manakah kalimat yang memiliki penggunaan kata serapan yang tepat? <br><small>Tentukan Tepat / Tidak Tepat!</small>',

statements:['Kata “deforestasi” pada kalimat (2) paragraf kedua.','Kata “menginvestigasi” pada kalimat (2) paragraf ketiga.','Kata “polusi” pada kalimat (1) paragraf keempat.'],
kunci:['Tepat','Tidak Tepat','Tepat'],

{id:18, passage:PASSAGE_F, tipe:'pg', tanya:'Hubungan makna antara kalimat (2) dan (3) pada paragraf kedua adalah …',
opts:['Akibat-sebab yang diperkuat dengan contoh deforestasi dan kerusakan lingkungan','Sebab-akibat yang mengajak pembaca untuk mengambil langkah tegas','Penegasan yang diperinci dengan contoh konkret yang bisa diaplikasikan pembaca','Perbandingan dari dua pandangan terkait dampak negatif deforestasi','Penyimpulan bahwa teknologi hijau merupakan solusi masalah deforestasi'],

{id:20, passage:PASSAGE_F, tipe:'cek', tanya:'Pernyataan yang tepat tentang teknologi hijau berdasarkan teks? <br><small>Jawaban benar lebih dari satu.</small>',

let cur=0, answers={}, hasil={}, ragu={};
function setFont(px){document.documentElement.style.setProperty('--soal-font',px+'px')}
let sisa=4493; setInterval(()=>{sisa=Math.max(0,sisa-1);let h=String(Math.floor(sisa/3600)).padStart(2,'0'),m=String(Math.floor(sisa%3600/60)).padStart(2,'0'),s=String(sisa%60).padStart(2,'0');document.getElementById('timer').textContent=h+':'+m+':'+s},1000);

function render(){
const q=SOAL[cur];
document.getElementById('nomor').textContent='Soal nomor '+(cur+1);
document.getElementById('teks').innerHTML=q.passage;
document.getElementById('prog').textContent=(cur+1)+' / '+SOAL.length;
let h='<p><b>'+q.tanya+'</b></p>';
if(q.tipe==='pg'){
q.opts.forEach((o,i)=>{const c=answers[q.id]===i?'checked':'';h+='<label class="opt" id="opt-'+i+'"><input type="radio" name="q'+q.id+'" '+(c)+' onclick="jawab('+i+')"> <span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>'});
}else if(q.tipe==='cek'){
q.opts.forEach((o,i)=>{const c=(answers[q.id]||[]).includes(i)?'checked':'';h+='<label class="opt" id="opt-'+i+'"><input type="checkbox" '+(c)+' onclick="jawabCek('+i+')"> <span>'+String.fromCharCode(65+i)+'. '+o+'</span></label>'});
h+='<p style="font-size:13px;color:#666">Bisa pilih lebih dari satu.</p>';
}else if(q.tipe==='bs'){
h+='<table class="bs"><tr><th>Pernyataan</th><th>'+q.labels[0]+'</th><th>'+q.labels[1]+'</th></tr>';
q.statements.forEach((s,i)=>{const v=(answers[q.id]||{})[i];h+='<tr id="row-'+i+'"><td>'+(i+1)+'. '+s+'</td><td style="text-align:center"><input type="radio" name="bs'+i+'" '+(v===q.labels[0]?'checked':'')+' onclick="jawabBS('+i+',0)"></td><td style="text-align:center"><input type="radio" name="bs'+i+'" '+(v===q.labels[1]?'checked':'')+' onclick="jawabBS('+i+',1)"></td></tr>'});
h+='</table>';
}else if(q.tipe==='info'){
h+='<p style="color:#888">Soal ini membutuhkan gambar/opsi yang tidak terlampir. Baca pembahasan di bawah.</p><button class="btn check" onclick="periksa()">Lihat Pembahasan</button>';
}
h+='<div style="margin-top:10px;display:flex;gap:8px"><button class="btn check" onclick="periksa()">Periksa Jawaban</button><button class="btn ghost" onclick="ulangi()">Ulangi</button></div>';
h+='<div class="explain" id="expl"></div>';
document.getElementById('soal').innerHTML=h;
document.getElementById('soal').scrollTop=0;
const rb=document.getElementById('raguBtn');rb.textContent=ragu[q.id]?'☑ Ragu-ragu':'☐ Ragu-ragu';rb.style.background=ragu[q.id]?'#ff8f00':'#f7b500';
if(hasil[q.id])showHasil(false);
}
function jawab(i){answers[SOAL[cur].id]=i}
function jawabCek(i){const id=SOAL[cur].id;let a=answers[id]||[];a=a.includes(i)?a.filter(x=>x!==i):[...a,i];answers[id]=a}
function jawabBS(i,li){const q=SOAL[cur];const id=q.id;let a=answers[id]||{};a[i]=q.labels[li];answers[id]=a}
function ulangi(){const id=SOAL[cur].id;delete answers[id];delete hasil[id];render()}
function nav(d){cur=Math.min(SOAL.length-1,Math.max(0,cur+d));render()}
function toggleRagu(){const id=SOAL[cur].id;ragu[id]=!ragu[id];render()}
function arraysEqual(a,b){if(a.length!==b.length)return false;let x=[...a].sort(),y=[...b].sort();return x.every((v,i)=>v===y[i])}
function periksa(){
const q=SOAL[cur],id=q.id;let benar=false,skor='';
if(q.tipe==='pg'){const j=answers[id];if(j===undefined){alert('Pilih dulu jawabanmu!');return}benar=q.kunci.includes(j);
q.opts.forEach((_,i)=>{const el=document.getElementById('opt-'+i);if(!el)return;el.classList.remove('correct','wrong');if(q.kunci.includes(i))el.classList.add('correct');else if(i===j)el.classList.add('wrong')});
}else if(q.tipe==='cek'){const j=answers[id]||[];if(!j.length){alert('Pilih dulu minimal satu!');return}benar=arraysEqual(j,q.kunci);
q.opts.forEach((_,i)=>{const el=document.getElementById('opt-'+i);el.classList.remove('correct','wrong');if(q.kunci.includes(i))el.classList.add('correct');if(j.includes(i)&&!q.kunci.includes(i))el.classList.add('wrong')});
}else if(q.tipe==='bs'){const j=answers[id]||{};if(Object.keys(j).length<q.statements.length){alert('Isi semua pernyataan dulu!');return}
benar=q.statements.every((_,i)=>j[i]===q.kunci[i]);
q.statements.forEach((_,i)=>{const r=document.getElementById('row-'+i);r.classList.remove('row-ok','row-bad');r.classList.add(j[i]===q.kunci[i]?'row-ok':'row-bad')});
}else{benar=null}
if(benar!==null)hasil[id]=benar;
showHasil(true);
updateGrid();
}
function showHasil(scroll){
const q=SOAL[cur],id=q.id;const ex=document.getElementById('expl');if(!ex)return;
if(q.tipe==='info'){ex.innerHTML='<b class="t">ℹ️ Info:</b><br>'+q.bahas;ex.classList.add('show');return}
const ok=hasil[id];let badge=ok===undefined?'':(ok?'<span class="badge ok">✅ BENAR</span>':'<span class="badge bad">❌ SALAH</span>');
let kunciTxt='';
if(q.tipe==='pg')kunciTxt='Kunci: <b>'+String.fromCharCode(65+q.kunci[0])+'. '+q.opts[q.kunci[0]]+'</b>';
if(q.tipe==='cek')kunciTxt='Kunci: <b>'+q.kunci.map(i=>String.fromCharCode(65+i)).join(', ')+'</b>';
if(q.tipe==='bs')kunciTxt='Kunci: <b>'+q.kunci.join(' | ')+'</b>';
ex.innerHTML=badge+'<br><br>'+kunciTxt+'<br><br><b class="t">💡 Pembahasan:</b><br>'+q.bahas;
ex.classList.add('show');if(scroll)ex.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function openDaftar(){document.getElementById('modal').classList.add('show');updateGrid()}
function closeDaftar(){document.getElementById('modal').classList.remove('show')}
function updateGrid(){
const g=document.getElementById('grid');g.innerHTML='';
SOAL.forEach((q,i)=>{const d=document.createElement('div');d.className='cell';d.textContent=i+1;
if(i===cur)d.classList.add('cur');if(ragu[q.id])d.classList.add('ragu');
if(hasil[q.id]===true)d.classList.add('benar');if(hasil[q.id]===false)d.classList.add('salah');
d.onclick=()=>{cur=i;closeDaftar();render()};g.appendChild(d)});
let b=Object.values(hasil).filter(v=>v===true).length,s=Object.values(hasil).filter(v=>v===false).length;
document.getElementById('score').innerHTML='Sudah diperiksa: <b>'+(b+s)+' / '+SOAL.length+'</b> — Benar: <b style="color:green">'+b+'</b> | Salah: <b style="color:red">'+s+'</b>'+(b+s>0?'<br>Nilai (dari yang diperiksa): <b>'+Math.round(b/Math.max(1,b+s)*100)+'</b>':'');
}
function resetAll(){answers={};hasil={};ragu={};render();updateGrid()}
render();updateGrid();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1)});
</script>
</body>
</html>
